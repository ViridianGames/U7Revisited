# Build the Windows MSVC Release executable and upload it as an artifact.
# Trigger: manual (Actions → Windows Build → Run workflow) or push to master.
#
# After download: copy U7Revisited.exe into Redist/ (cwd for assets), then run
# under Proton or on a real Windows box. Does not bundle original U7 data.
#
# Pin windows-2022: windows-latest moved to VS 2026, which does not provide the
# "Visual Studio 17 2022" CMake generator this project expects with raylib.lib.

name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: MSVC Release (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          Write-Host "--- CMake generators (Visual Studio) ---"
          cmake --help | Select-String -Pattern "Visual Studio"
          Write-Host "--- vswhere ---"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath

      - name: Configure CMake (VS 2022 x64)
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build

      - name: Build U7Revisited (Release)
        run: cmake --build build --config Release --target U7Revisited --parallel

      # Do NOT recurse Redist/ (huge U7 data tree). Prefer the MSVC default
      # build/Release output, then fall back to whatever POST_BUILD left in Redist.
      - name: Copy exe into Redist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path Redist | Out-Null
          $dest = "Redist\U7Revisited.exe"

          Write-Host "--- .exe files under build/ only ---"
          Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

          $src = $null
          foreach ($c in @(
            "build\Release\U7Revisited.exe",
            "build\U7Revisited\Release\U7Revisited.exe",
            "Redist\U7Revisited.exe"
          )) {
            if (Test-Path -LiteralPath $c) { $src = $c; break }
          }
          if (-not $src) {
            $hit = Get-ChildItem -Path build -Recurse -Filter "U7Revisited.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) { $src = $hit.FullName }
          }
          if (-not $src) {
            Write-Error "U7Revisited.exe not found under build/ after Release build"
            exit 1
          }

          Write-Host "Copying $src -> $dest"
          # cmake -E copy is more reliable than Copy-Item across drive quirks
          cmake -E copy_if_different "$src" "$dest"
          if (-not (Test-Path -LiteralPath $dest)) {
            Write-Error "Copy finished but $dest is missing"
            exit 1
          }
          Get-Item -LiteralPath $dest | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: U7Revisited
          path: Redist/U7Revisited.exe
          if-no-files-found: error
          retention-days: 14
