# Build the Windows MSVC Release executable, put it in Redist/, upload an
# artifact, and commit Redist/U7Revisited.exe back to master so `git pull`
# picks up the new binary.
#
# Pin windows-2022: windows-latest moved to VS 2026, which does not provide the
# "Visual Studio 17 2022" CMake generator this project expects with raylib.lib.
#
# Loop guards: push paths-ignore for the exe + "[skip ci]" on the bot commit.

name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "Redist/U7Revisited.exe"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: MSVC Release (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history / writeable remote for the bot push.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          Write-Host "--- CMake generators (Visual Studio) ---"
          cmake --help | Select-String -Pattern "Visual Studio"
          Write-Host "--- vswhere ---"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath

      - name: Configure CMake (VS 2022 x64)
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build

      - name: Build U7Revisited (Release)
        run: cmake --build build --config Release --target U7Revisited --parallel

      # Do NOT recurse Redist/ (huge U7 data tree). Prefer the MSVC default
      # build/Release output, then fall back to whatever POST_BUILD left in Redist.
      - name: Copy exe into Redist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path Redist | Out-Null
          $dest = "Redist\U7Revisited.exe"

          Write-Host "--- .exe files under build/ only ---"
          Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

          $src = $null
          foreach ($c in @(
            "build\Release\U7Revisited.exe",
            "build\U7Revisited\Release\U7Revisited.exe",
            "Redist\U7Revisited.exe"
          )) {
            if (Test-Path -LiteralPath $c) { $src = $c; break }
          }
          if (-not $src) {
            $hit = Get-ChildItem -Path build -Recurse -Filter "U7Revisited.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) { $src = $hit.FullName }
          }
          if (-not $src) {
            Write-Error "U7Revisited.exe not found under build/ after Release build"
            exit 1
          }

          Write-Host "Copying $src -> $dest"
          cmake -E copy_if_different "$src" "$dest"
          if (-not (Test-Path -LiteralPath $dest)) {
            Write-Error "Copy finished but $dest is missing"
            exit 1
          }
          Get-Item -LiteralPath $dest | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: U7Revisited
          path: Redist/U7Revisited.exe
          if-no-files-found: error
          retention-days: 14

      - name: Commit Redist/U7Revisited.exe to master
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "Redist/U7Revisited.exe"
          $porcelain = git status --porcelain -- "Redist/U7Revisited.exe"
          if (-not $porcelain) {
            Write-Host "Redist/U7Revisited.exe unchanged; nothing to commit."
            exit 0
          }

          git commit -m "Update Redist/U7Revisited.exe [skip ci]"
          # Retry once if master moved while we built.
          git pull --rebase --autostash origin master
          git push origin HEAD:master
          Write-Host "Pushed Redist/U7Revisited.exe to master."
