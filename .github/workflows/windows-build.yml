# Build the Windows MSVC Release executable and upload it as an artifact.
# Trigger: manual (Actions → Windows Build → Run workflow) or push to master.
#
# After download: copy U7Revisited.exe into Redist/ (cwd for assets), then run
# under Proton or on a real Windows box. Does not bundle original U7 data.

name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: MSVC Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (VS 2022 x64)
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build U7Revisited (Release)
        run: cmake --build build --config Release --target U7Revisited --parallel

      - name: Verify Redist exe
        shell: pwsh
        run: |
          $exe = "Redist/U7Revisited.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe after POST_BUILD copy — listing Redist and build/Release"
            Get-ChildItem Redist -ErrorAction SilentlyContinue | Select-Object Name
            Get-ChildItem build/Release -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: U7Revisited-windows-x64
          path: |
            Redist/U7Revisited.exe
          if-no-files-found: error
          retention-days: 14
